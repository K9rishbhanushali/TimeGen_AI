services:
  - type: web
    runtime: node
    name: timegen-ai
    plan: free
    # NODE_ENV=production is required at runtime, but Vite and esbuild are
    # development dependencies and must still be installed for the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUIRE_MONGODB
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
